[workspace]
members = [
    "crates/mitrdb-common",
    "crates/mitrdb-observe",
    "crates/mitrdb-storage",
    "crates/mitrdb-txn",
    "crates/mitrdb-catalog",
    "crates/mitrdb-query",
    "crates/mitrdb-exec",
    "crates/mitrdb-server",
