[package]
name = "mitrdb-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
mitrdb-catalog = { path = "../mitrdb-catalog" }
mitrdb-common = { path = "../mitrdb-common" }
mitrdb-exec = { path = "../mitrdb-exec" }
mitrdb-observe = { path = "../mitrdb-observe" }
mitrdb-query = { path = "../mitrdb-query" }
mitrdb-storage = { path = "../mitrdb-storage" }
mitrdb-txn = { path = "../mitrdb-txn" }


rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1.9"
getrandom = "0.2"

[features]
# Test-only: forwards storage failure injection (Server::set_fail_page_op_after). Off by default.
fault-injection = ["mitrdb-storage/fault-injection"]

[[test]]
name = "alter_type_inject"
required-features = ["fault-injection"]
