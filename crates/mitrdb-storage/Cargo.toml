[package]
name = "mitrdb-storage"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
mitrdb-common = { path = "../mitrdb-common" }
mitrdb-observe = { path = "../mitrdb-observe" }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[features]
# Test-only failure injection (DiskManager::set_fail_alloc_after). Off by default.
fault-injection = []

[[test]]
name = "btree_newpage_fail_probe2"
required-features = ["fault-injection"]

[[test]]
name = "btree_newpage_fail_atomicity"
required-features = ["fault-injection"]
