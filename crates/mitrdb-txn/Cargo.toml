[package]
name = "mitrdb-txn"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
mitrdb-common = { path = "../mitrdb-common" }
mitrdb-observe = { path = "../mitrdb-observe" }
mitrdb-storage = { path = "../mitrdb-storage" }
parking_lot = "0.12"

[features]
# Test-only: forwards storage failure injection (DiskManager::set_fail_alloc_after).
fault-injection = ["mitrdb-storage/fault-injection"]

[[test]]
name = "txn_newpage_fail_atomicity"
required-features = ["fault-injection"]
